[theme]
# Color scheme for the app
primaryColor = "#2ECC71"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F0F0"
textColor = "#262730"
font = "sans serif"

[client]
showErrorDetails = false
toolbarMode = "viewer"

[logger]
level = "error"

[server]
# Server configuration
headless = true
maxUploadSize = 200
runOnSave = false
port = 8501
